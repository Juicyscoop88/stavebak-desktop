name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Povinné kontroly pro merge do main: validate a secrets.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner -v .

  # Build a testy na obou cílových platformách (část Rust kódu je jen pro macOS, část jen pro Windows).
  # Povinná kontrola v rulesetu je `validate`, proto se matrix jmenuje build a validate ho shrnuje.
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Verze sedí v package.json, tauri.conf.json a Cargo.toml
        run: node scripts/check-version.mjs
      - run: pnpm install --frozen-lockfile
      - name: Typecheck a build frontendu (tsc && vite build)
        run: pnpm build
      - name: Testy frontendu
        run: pnpm exec vitest run
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Varování clippy zatím kontrolu neshodí (zděděný dluh), chyby ano.
      - name: Clippy (Tauri)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets
      - name: Testy (Tauri)
        working-directory: src-tauri
        run: cargo test --locked

  validate:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Všechny platformy prošly
        run: test "${{ needs.build.result }}" = success
