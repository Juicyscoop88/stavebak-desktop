[package]
name = "stavebak"
version = "0.17.2"
description = "Stavebák Desktop: aplikace pro projektanty, která spouští Claude Code uživatele"
authors = ["Stavebák"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "stavebak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
notify = "7"
base64 = "0.22"
serde_yaml = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures-util = "0.3"
# Most MCP na loopbacku (mcp_bridge.rs); stejné verze už táhne reqwest
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rand = "0.8"
trash = "5"
flate2 = "1"
tar = "0.4"
zip = "2"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
enigo = "0.6"
xcap = "0.9.8"
# xcap má image bez kodeků, snímky pro model jdou jako JPEG (menší než PNG)
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tauri-plugin-global-shortcut = "=2.3.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
